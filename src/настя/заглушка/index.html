<!DOCTYPE html>

<head>

  <title>Фанс Метч</title>

<body>

  <main class="stub" id="stub">

    <div class="stub__stage">

      <div class="stub__logo" id="stubLogo" role="button" tabindex="0" aria-label="Сменить цвет">

      <!-- Картинки, которые покачиваются -->

      <a class="stub__social stub__social--tg" href="#">
        <img src="img/tg.svg" alt="">
